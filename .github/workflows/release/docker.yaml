name: Build Release (JAR)
on:
  workflow_call:
    inputs:
      version:
        description: Version
        type: string
        required: true

env:
  JAVA_VERSION: 25
  JAVA_DIST: zulu
  JAVA_ARCH: x64

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DIST }}
          architecture: ${{ env.JAVA_ARCH }}

      - name: Build
        run: ./gradlew check jar

      - name: Login to Docker registry
        uses: docker/login-action@v4
        if: ${{ github.ref == 'refs/heads/master' && steps.check_release.outputs.enabled == 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Docker
        if: ${{ github.ref == 'refs/heads/master' && steps.check_release.outputs.enabled == 'true' }}
        run: |
          echo "Docker: $IMAGE_ID:$IMAGE_TAG"
          docker build --tag $IMAGE_ID:$IMAGE_TAG .
          docker push $IMAGE_ID:$IMAGE_TAG
        env:
          IMAGE_ID: ghcr.io/tarmolehtpuu/miner-exporter
          IMAGE_TAG: ${{ env.VERSION }}