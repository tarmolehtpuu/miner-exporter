name: Release Docker
on:
  workflow_call:
    inputs:
      version:
        description: Version
        type: string
        required: true

permissions:
  packages: write
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Create directories
        run: |
          mkdir build
          mkdir build/libs

      - name: Download JAR
        uses: actions/download-artifact@v8
        with:
          name: app.jar
          path: build/libs
          skip-decompress: true

      - name: Login to Docker registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Docker (Java)
        run: |
          echo "Docker: $IMAGE_ID:$IMAGE_TAG"
          docker build --tag $IMAGE_ID:$IMAGE_TAG .
          docker push $IMAGE_ID:$IMAGE_TAG
        env:
          IMAGE_ID: ghcr.io/tarmolehtpuu/miner-exporter
          IMAGE_TAG: ${{ inputs.version }}
