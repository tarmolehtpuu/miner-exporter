name: Release (Docker)
on:
  workflow_call:
    inputs:
      version:
        description: Version
        type: string
        required: true

permissions:
  packages: write
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Create directories
        run: |
          mkdir -p build
          mkdir -p build/libs

      - name: Download JAR
        uses: actions/download-artifact@v8
        with:
          name: app.jar
          path: build/libs
          skip-decompress: true

      - name: Docker Setup (QEMU)
        uses: docker/setup-qemu-action@v4

      - name: Docker Setup (buildx)
        uses: docker/setup-buildx-action@v4

      - name: Docker Setup (login)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrest.GITHUB_TOKEN }}

      - name: Docker Build and Push
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 -t $IMAGE_ID:$IMAGE_TAG --push .
        env:
          IMAGE_ID: ghcr.io/tarmolehtpuu/miner-exporter
          IMAGE_TAG: ${{ inputs.VERSION