name: Build

on: push

env:
  JAVA_VERSION: 25
  JAVA_DIST: zulu
  JAVA_ARCH: x64

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read VERSION
        run: |
          echo "VERSION=$(cat VERSION | xargs)" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DIST }}
          architecture: ${{ env.JAVA_ARCH }}

      - name: Build
        run: ./gradlew check jar

      - name: Test Report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: "**/build/test-results/test/TEST-*.xml"

      - name: Jacoco Report
        if: ${{ github.ref != 'refs/heads/master' }}
        id: jacoco
        uses: madrapps/jacoco-report@v1.7.2
        with:
          paths: build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 70
          min-coverage-changed-files: 70
          title: Code Coverage
          update-comment: true

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/test
            **/build/reports/jacoco/test/html

      - name: Check release
        run: |
          echo "Hello"
          echo "FIXME"

      - name: Create release
        if: ${{ github.ref == 'refs/heads/master' }}
        run: |
          gh release create v${VERSION} \
            --repo tarmolehtpuu/miner-exporter \
            --title miner-exporter-${VERSION} \
            --generate-notes \
            miner-exporter-${VERSION}.jar \
            miner-exporter-${VERSION}.sha256
        working-directory: build/libs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            
