name: Build

on: push

env:
  JAVA_VERSION: 25
  JAVA_DIST: zulu
  JAVA_ARCH: x64

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read VERSION
        run: |
          echo "VERSION=$(cat VERSION | xargs)" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DIST }}
          architecture: ${{ env.JAVA_ARCH }}

      - name: Build
        run: ./gradlew check jar

      - name: Test Report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: "**/build/test-results/test/TEST-*.xml"

      - name: Jacoco Report
        if: ${{ github.ref != 'refs/heads/master' }}
        id: jacoco
        uses: madrapps/jacoco-report@v1.7.2
        with:
          paths: build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 70
          min-coverage-changed-files: 70
          title: Code Coverage
          update-comment: true

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/test
            **/build/reports/jacoco/test/html

      - name: Check Release
        if: ${{ github.ref == 'refs/heads/master' }}
        run: |
          if gh releease view v${VERSION} > /dev/null 2&1; then
            echo "RELEASE=false" >> $GITHUB_ENV
          else
            echo "RELEASE=true" >> $GITHUB_ENV
          fi         

      - name: Login to registry
        uses: docker/login-action@v3
        if: ${{ github.ref == 'refs/heads/master' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Docker
        if: ${{ github.ref == 'refs/heads/master' }}
        run: |
          if "$RELEASE"; then
            docker build --tag $IMAGE_ID:$IMAGE_TAG .
            docker pushj $IMAGE_ID:$IMAGE_TAG
          else
            echo "Release exists, skipping Docker"
          fi
        env:
          IMAGE_ID: ghcr.io/tarmolehtpuu/miner-exporter
          IMAGE_TAG: ${{ env.VERSION }}

      - name: Release JAR
        if: ${{ github.ref == 'refs/heads/master' }}
        run: |
          if "$RELEASE"; then
            mv build/libs/app.jar build/libs/miner-exporter-$VERSION.jar
            gh release create v${VERSION} \
              --repo tarmolehtpuu/miner-exporter \
              --title miner-exporter-${VERSION} \
              --generate-notes \
              miner-exporter-$VERSION.jar
          else
            echo "Release exists, skipping JAR"
          fi
        working-directory: build/libs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
