name: Release

on:
  push:
    branches:
      - master

permissions:
  packages: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check_version.outputs.version }}
      cleared: ${{ steps.check_release.outputs.cleared }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Version
        id: check_version
        run: |
          echo "version=$(cat VERSION | xargs)" >> $GITHUB_OUTPUT

      - name: Check Release
        id: check_release
        run: |
          VERSION=${{ steps.check_version.outputs.version }}
          if gh release view v${VERSION} > /dev/null 2>&1; then
            echo "cleared=false" >> $GITHUB_OUTPUT
            echo "Release v${VERSION} already exists. Skipping."
          else
            echo "cleared=true" >> $GITHUB_OUTPUT
            echo "Creating release: v${VERSION}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-jar:
    if: ${{ needs.preflight.outputs.cleared == 'true' }}
    needs:
      - preflight
    uses: ./.github/workflows/release-jar.yaml

  release-native:
    if: ${{ needs.preflight.outputs.cleared == 'true' }}
    needs:
      - preflight
      - release-jar
    uses: ./.github/workflows/release-native.yaml

  release-docker:
    if: ${{ needs.preflight.outputs.cleared == 'true' }}
    needs:
      - preflight
      - release-jar
      - release-native
    uses: ./.github/workflows/release-docker.yaml
    with:
      version: ${{ needs.preflight.outputs.version }}

  release:
    if: ${{ needs.preflight.outputs.cleared == 'true' }}
    needs:
      - preflight
      - release-jar
      - release-native
      - release-docker
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Create release directory
        run: |
          mkdir -p release

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: release

      - name: List artifacts
        run:
          ls -la release

      - name: Release
        run: |
          echo "Preparing release..."
          ls -la .
          
          mv app.jar miner-exporter-${{ inputs.version }}.jar
          mv miner-exporter-linux-amd64 miner-exporter-${{ inputs.version }}-linux-amd64
          
          tar -czvf miner-exporter-${{ inputs.version }}-linux-amd64.tar.gz miner-exporter-${{ inputs.version }}-linux-amd64
          
          echo "Release prepared"
          ls -la
          
          echo "Releasing..."
          gh release create v${{ inputs.version }} \
            --repo tarmolehtpuu/miner-exporter \
            --title miner-exporter-${{ inputs.version }} \
            --generate-notes *.jar *.tar.gz
          
          echo "Release ${{ inputs.version }} DONE"
        working-directory: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}